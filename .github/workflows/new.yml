name: windows-path-test

on:
  push:
    branches: [ci-windows-test]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.fix && 'with fix' || 'without fix (expected to FAIL)' }}
    runs-on: windows-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        fix: [true, false]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # bootstrap looks for the latest upstream bors commit in history
          submodules: false # bootstrap fetches the ones it needs

      - name: Show which upstream commit bootstrap will use for CI artifacts
        shell: bash
        run: |
          git rev-list --author-date-order --author='bors@rust-lang.org' -n1 HEAD
          git log -1 --format='%H %an %ad %s' "$(git rev-list --author-date-order --author='bors@rust-lang.org' -n1 HEAD)"

      - name: Revert path.rs to its pre-fix version (without-fix run only)
        if: ${{ !matrix.fix }}
        shell: bash
        run: |
          git fetch --no-tags https://github.com/rust-lang/rust.git main
          base=$(git merge-base HEAD FETCH_HEAD)
          echo "merge-base with upstream main: $base"
          git checkout "$base" -- library/std/src/path.rs
          git --no-pager diff --stat HEAD -- library/std/src/path.rs

      # `--ci false`: without it bootstrap assumes HEAD^1 is an upstream bors commit
      # (true for rust-lang/rust's own CI, not for a plain push) and tries to download
      # LLVM for that SHA, which 404s.
      - name: Run the new tests
        shell: bash
        run: python x.py test library/std --stage 1 --tests --ci false --test-args components_eq
