name: windows-path-test

on:
  push:
    branches: [ci-windows-test]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.fix && 'with fix' || 'without fix (expected to FAIL)' }}
    runs-on: windows-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        fix: [true, false]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # bootstrap uses git history to find upstream CI artifacts
          submodules: false # bootstrap fetches the ones it needs

      - name: Revert path.rs to upstream (without-fix run only)
        if: ${{ !matrix.fix }}
        shell: bash
        run: |
          git fetch --no-tags --depth=1 https://github.com/rust-lang/rust.git main
          git checkout FETCH_HEAD -- library/std/src/path.rs

      - name: Run the new tests
        shell: bash
        run: |
          python x.py test library/std --stage 1 --tests --test-args components_eq
          # Optional speedup if the plain run takes too long (needs full history):
          # python x.py test library/std --stage 1 --tests \
          #   --set rust.download-rustc=if-unchanged --test-args components_eq
